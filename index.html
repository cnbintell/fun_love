<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do you love me?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="box" id="ask">
    <img class="gif" id="main" src="reply-me.gif" alt="Reply me">
    <p id="cap" class="cap"></p>
    <h2>Do you love me?</h2>
    <div class="btns"><button id="yes">Yes</button><button id="no">No</button></div>
  </div>
  <div class="box" id="result">
    <img class="gif" id="yesgif" alt="I love you">
    <h2 id="yescap" class="cap yescap"></h2>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
